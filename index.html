function rng(seed){return()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}}
function ML(m){const[y,mo]=(S.start||'2026-10').split('-').map(Number);return new Date(y,mo-1+m,1).toLocaleString('en-GB',{month:'short',year:'numeric'})}

function build(porder,rorder,chunk){
 const pl=[],P=S.projects,free=porder.filter(p=>!p.lock&&inP(p));
 for(let m=0;m<S.months;m++){
  const old=S.plan&&S.plan[m];
  if(S.mlock[m]||!inM(m)){pl.push(old||{});continue}
  const mp={},used={},spend={},need={};S.res.forEach(r=>used[r.id]=0);
  P.forEach(p=>{mp[p.id]={};spend[p.id]=0;
   if(!free.includes(p)){const o=(old&&old[p.id])||{};for(const k in o){if(k in used){mp[p.id][k]=o[k];used[k]+=o[k]}}}});
  free.forEach(p=>need[p.id]=p.demand);
  let prog=true;
  while(prog){prog=false;
   for(const p of free){if(need[p.id]<.01)continue;let s=chunk?Math.min(.5,need[p.id]):need[p.id];
    for(const r of rorder){if(s<.01)break;if(r.proj&&r.proj!=p.id)continue;
     const x=r2(Math.min(s,r.cap-used[r.id],(p.budget/S.months-spend[p.id])/r.cost));
     if(x>=.01){mp[p.id][r.id]=r2((mp[p.id][r.id]||0)+x);used[r.id]+=x;spend[p.id]+=x*r.cost;s-=x;need[p.id]-=x;prog=true}}}}
  pl.push(mp)}
 return pl}
function pcost(plan,pid,m){let c=0;const a=(plan[m]||{})[pid]||{};for(const k in a){const r=S.res.find(r=>r.id==k);if(r)c+=a[k]*r.cost}return c}
function pfte(plan,pid,m){let c=0;const a=(plan[m]||{})[pid]||{};for(const k in a)c+=a[k];return c}
function score(plan){let un=0,cost=0;S.projects.forEach(p=>{for(let m=0;m<S.months;m++){un+=Math.max(0,p.demand-pfte(plan,p.id,m))*p.prio;cost+=pcost(plan,p.id,m)}});return un*1e6+cost}
function generate(){
 const P=S.projects,R=S.res,out=[],seen=new Set();
 const add=(label,po,ro,ch)=>{const pl=build(po,ro,ch),sig=JSON.stringify(pl);if(seen.has(sig))return;seen.add(sig);out.push({label,plan:pl,score:score(pl)})};
 const by=(a,f)=>[...a].sort(f),cheap=by(R,(a,b)=>a.cost-b.cost),dear=by(R,(a,b)=>b.cost-a.cost);
 const o={'priority first':by(P,(a,b)=>b.prio-a.prio),'best-funded first':by(P,(a,b)=>b.budget/b.demand-a.budget/a.demand),'largest demand first':by(P,(a,b)=>b.demand-a.demand),'smallest demand first':by(P,(a,b)=>a.demand-b.demand)};
 for(const k in o){add('Lowest-cost resources, '+k,o[k],cheap,false);add('Fair share in 0.5 FTE rounds, '+k,o[k],cheap,true);add('Premium resources, '+k,o[k],dear,false)}
 const g=rng(7);for(let i=0;i<40;i++){const sh=a=>by(a,()=>g()-.5);add('Alternative mix '+(i+1),sh(P),i%3?sh(R):cheap,g()>.5)}
 return out.sort((a,b)=>a.score-b.score)}

 if((S.selM&&!S.selM.length)||(S.selP&&!S.selP.length)){alert('Select at least one month and one project.');return false}
 S.cands=generate();S.ci=0;S.plan=S.cands[0].plan;S.stale=false;S.note='Best of '+S.cands.length+' options found for '+scopeTxt()+'. Everything outside this scope was left unchanged.';return true}

let sidebarCollapsed=false;
function toggleSidebar(){sidebarCollapsed=!sidebarCollapsed;render()}
function sideNav(){const v=DB.view||'port';const opts=[['port','◫','Portfolio'],['setup','⚙','Programme setup'],['res','♧','Resources'],['plan','▤','Allocation plan']];return `<aside class="side"><button class="side-toggle" onclick="toggleSidebar()">☰ <span class="nav-name">Collapse menu</span></button><div class="side-label">WORKSPACE</div><div class="side-nav">${opts.map(([id,ic,name])=>`<button class="${v===id?'on':''}" onclick="DB.view='${id}';render()" title="${name}">${ic} <span class="nav-name">${name}</span></button>`).join('')}</div><div class="side-label">PROGRAMME</div><div class="sidebar-workspace"><label>Active programme<select onchange="sw(+this.value)">${DB.progs.map((q,i)=>`<option value="${i}" ${i===DB.cur?'selected':''}>${E(q.name)}</option>`).join('')}</select></label><button onclick="addProg()">+ New programme</button></div><div class="side-foot">Your planning workspace<br>Locally stored in this browser. Download regular backups.</div></aside>`}
function executiveCharts(){const q=DB.progs;const budget=q.reduce((a,x)=>a+(+x.budget||0),0);const cost=q.reduce((a,x)=>a+stats(x).cost,0);const used=budget>0?Math.max(0,Math.min(100,cost/budget*100)):0;const rest=Math.max(0,100-used);const over=cost>budget&&budget>0;const rows=q.map(x=>({name:x.name,cost:stats(x).cost,budget:+x.budget||0}));const scale=Math.max(1,...rows.map(x=>Math.max(x.cost,x.budget)));return `<div class="visual-grid"><section class="card viz-card"><h2>Budget utilisation</h2><p class="viz-caption">Portfolio-wide planned expenditure against available budget</p><div class="donut-layout"><div class="donut" style="background:conic-gradient(var(--ac) 0 ${used}%,var(--ln) ${used}% 100%)"><div class="donut-core"><strong>${budget?Math.round(cost/budget*100):0}%</strong><small>Budget used</small></div></div><div class="legend"><span><i style="background:var(--ac)"></i>Planned cost: £${fmt(cost)}</span><span><i style="background:var(--ln)"></i>Remaining: £${fmt(budget-cost)}</span>${over?'<span class="b">Over the total budget</span>':''}</div></div></section><section class="card viz-card"><h2>Programme cost comparison</h2><p class="viz-caption">Planned costs across programmes; bars scaled to the largest programme budget or cost</p>${rows.map(x=>`<div class="viz-row"><span class="viz-name" title="${E(x.name)}">${E(x.name)}</span><div class="viz-track"><span style="width:${Math.min(100,x.cost/scale*100)}%"></span></div><span class="viz-value">£${fmt(x.cost)}</span></div>`).join('')||'<p class="m">No programmes available</p>'}</section></div>`}

function portfolio(){
 let tb=0,tc=0,tu=0;
 const rows=DB.progs.map((q,i)=>{const s=stats(q);tb+=q.budget;tc+=s.cost;tu+=s.un/q.months;const pct=q.budget?s.cost/q.budget*100:0;
  const st=!q.plan?'<span class="m">Not optimised</span>':s.cost>q.budget?'<span class="b">Over budget</span>':s.un>.01?'<span class="w">Demand not met</span>':'<span class="ok">On plan</span>';
  return `<tr><td><b>${E(q.name)}</b></td><td class="n">${fmt(q.budget)}</td><td class="n">${fmt(s.alloc)}</td><td class="n">${fmt(s.cost)}</td><td><div class="pb"><i class="${pct>100?'o':''}" style="width:${Math.min(100,pct)}%"></i></div></td><td class="n">${pct.toFixed(0)}%</td><td class="n">${(s.un/q.months).toFixed(2)}</td><td>${st}</td><td><button class="s" onclick="sw(${i})">Open</button></td></tr>`}).join('');
 return `<div class="k"><div><span>Programmes</span><b class="big">${DB.progs.length}</b></div><div><span>Total budget</span><b class="big">${fmt(tb)}</b></div><div><span>Planned cost</span><b class="big">${fmt(tc)}</b></div><div><span>Budget remaining</span><b class="big">${fmt(tb-tc)}</b></div><div><span>Unfilled FTE per month</span><b class="big ${tu>.01?'w':''}">${tu.toFixed(2)}</b></div></div>
 ${executiveCharts()}<div class="card"><h2>Portfolio overview</h2><div class="sc"><table><tr><th>Programme</th><th class="n">Budget</th><th class="n">Allocated</th><th class="n">Planned cost</th><th>Used</th><th class="n">%</th><th class="n">Unfilled FTE</th><th>Status</th><th></th></tr>${rows}
 <tr class="t"><td>Total</td><td class="n">${fmt(tb)}</td><td></td><td class="n">${fmt(tc)}</td><td></td><td class="n">${tb?(tc/tb*100).toFixed(0):0}%</td><td class="n">${tu.toFixed(2)}</td><td></td><td></td></tr></table></div></div>`}

function setup(){
 const P=S.projects.map((p,i)=>`<tr class="${p.lock?'lk':''}"><td><input value="${E(p.name)}" onchange="U('projects',${i},'name',this.value)"></td>
 <td><input type="number" min="0" value="${p.budget}" onchange="U('projects',${i},'budget',+this.value)"></td><td class="n">${S.budget?(p.budget/S.budget*100).toFixed(1):0}%</td>
 <td><input type="number" min="0" step="0.5" value="${D2(p.demand)}" onchange="U('projects',${i},'demand',+this.value/KK())"></td>
 <td><select onchange="U('projects',${i},'prio',+this.value)">${[1,2,3,4,5].map(n=>`<option ${n==p.prio?'selected':''}>${n}</option>`).join('')}</select></td>
 <td><button class="s" onclick="lockP(${i})">${p.lock?'Locked – unlock':'Lock'}</button> <button class="s x" onclick="del('projects',${i})">Remove</button></td></tr>`).join('');
 const R=S.res.map((r,i)=>`<tr><td><input value="${E(r.name)}" onchange="U('res',${i},'name',this.value)"></td><td><input type="number" min="0" value="${r.cost}" onchange="U('res',${i},'cost',+this.value)"></td><td><input type="number" min="0" step="0.5" value="${r.cap}" onchange="U('res',${i},'cap',+this.value)"></td><td><button class="s x" onclick="del('res',${i})">Remove</button></td></tr>`).join('');
 const tot=S.projects.reduce((a,p)=>a+p.budget,0),dm=S.projects.reduce((a,p)=>a+p.demand,0),cp=S.res.reduce((a,r)=>a+r.cap,0);
 return `<div class="setup-action"><div><strong>Programme setup</strong><span>Configure your budget, projects and resources, then generate an allocation plan.</span></div><button class="p" onclick="optimise()">✦ Optimise plan →</button></div><div class="card"><h2>Programme details</h2><div class="g">
 <label>Programme name<input value="${E(S.name)}" onchange="S.name=this.value;render()"></label>
 <label>Total budget<input type="number" min="0" value="${S.budget}" onchange="S.budget=+this.value;S.stale=!!S.plan;render()"></label>
 <label>First month<input type="month" value="${S.start}" onchange="S.start=this.value;render()"></label>
 <label>Effort and rates<select onchange="S.unit=this.value;render()"><option value="month" ${S.unit!='day'?'selected':''}>Per month (FTE)</option><option value="day" ${S.unit=='day'?'selected':''}>Per day</option></select></label>
 <label>Working days per month<input type="number" min="1" max="31" value="${S.wd||20}" onchange="S.wd=+this.value||20;render()"></label>
 <label>Months planned<input type="number" min="1" max="24" value="${S.months}" onchange="S.months=Math.max(1,Math.min(24,+this.value||1));S.selM=null;S.stale=!!S.plan;render()"></label></div>
 <p class="${tot>S.budget?'b':'m'}" style="margin:10px 0 0">Project budgets total ${fmt(tot)} of ${fmt(S.budget)} (${S.budget?(tot/S.budget*100).toFixed(0):0}%)${tot>S.budget?' – above the programme budget':''}.</p></div>
 <div class="card"><h2>Projects</h2><div class="sc"><table><tr><th>Project</th><th>Budget</th><th class="n">Share</th><th>${S.unit=='day'?'Days':'FTE'} needed per month</th><th>Priority (5 = high)</th><th></th></tr>${P}</table></div>
 <div class="g" style="margin-top:10px"><button onclick="add('projects')">Add project</button></div>
 <p class="m" style="margin:10px 0 0">Locking a project freezes its current FTE allocation. The optimiser never changes it and keeps those people reserved.</p></div>
 <div class="card"><h2>Resources</h2><p class="m" style="margin:0 0 10px">People and rates are managed in the Resources tab.</p>
 <div class="g" style="margin-top:10px"><button onclick="DB.view='res';render()">Open Resources</button><button class="x" onclick="delProg()">Delete this programme</button></div>
 <p class="${dm>cp?'w':'m'}" style="margin:10px 0 0">Demand ${D2(dm)} ${UL()} against capacity ${D2(cp)} ${UL()}${dm>cp?' – some demand cannot be met':''}.</p></div>
 <div class="g"><button class="p" onclick="optimise()">Optimise plan</button></div>`}

function plan(){
 const M=S.months,P=S.projects,pl=S.plan;
 const chM=Array.from({length:M},(_,m)=>`<button class="chip ${inM(m)?'on':''}" onclick="togM(${m})">${ML(m)}${S.mlock[m]?' (locked)':''}</button>`).join(' ');
 const chP=P.map((p,pi)=>`<button class="chip ${inP(p)?'on':''}" onclick="togP(${p.id})"><span class="dot" style="background:${PC(pi)}"></span>${E(p.name)}${p.lock?' (locked)':''}</button>`).join(' ');
 const ctl=`<div class="card"><h2>${E(S.name)}: choose what to optimise</h2>
 <div class="lbl">Months</div><div class="seg">${chM}</div><div class="lbl">Projects</div><div class="seg">${chP||'<span class="m">No projects yet. Add them in Setup.</span>'}</div>
 <div class="g" style="margin-top:14px"><button class="p" onclick="optimise()">Optimise selected (${scopeTxt()})</button><button onclick="selAll()">Select all</button><button onclick="another()" ${pl?'':'disabled'}>Try another option</button><button onclick="nextMonth()">Add next month</button></div>
 <p class="m" style="margin:10px 0 0">Only the selected projects and months change. Locked projects and locked months are never touched.</p></div>`;
 if(!pl)return ctl+`<div class="card"><p class="m" style="margin:0">No plan yet. Choose Optimise selected to create one.</p></div>`;
 let tc=0,un=0;
 const rows=P.map((p,pi)=>{let c=0,f=0;for(let m=0;m<M;m++){c+=pcost(pl,p.id,m);f+=pfte(pl,p.id,m)}tc+=c;const u=Math.max(0,p.demand*M-f);un+=u;const pct=p.budget?c/p.budget*100:0;
  return `<tr class="${p.lock?'lk':''}"><td><span class="dot" style="background:${PC(pi)}"></span><b>${E(p.name)}</b>${p.lock?' (locked)':''}</td><td class="n">${fmt(p.budget)}</td><td class="n">${fmt(c)}</td><td><div class="pb"><i class="${pct>100?'o':''}" style="${pct>100?'':'background:'+PC(pi)+';'}width:${Math.min(100,pct)}%"></i></div></td><td class="n">${pct.toFixed(0)}%</td><td class="n">${D2(f/M)} / ${D2(p.demand)}</td><td>${u>.01?'<span class="pill w">'+D2(u/M)+' '+UL()+' short</span>':'<span class="pill ok">Covered</span>'}</td><td class="n">${fmt(p.budget-c)}</td><td><button class="s" onclick="reopt(${p.id})" ${p.lock?'disabled':''}>Re-optimise</button></td></tr>`}).join('');
 const mc=Array.from({length:M},(_,m)=>`${ML(m)}: <b>${fmt(P.reduce((a,p)=>a+pcost(pl,p.id,m),0))}</b>`).join(' &nbsp;|&nbsp; ');
 const m=Math.min(S.month,M-1);
 const tabs=Array.from({length:M},(_,i)=>`<button class="${i==m?'on':''}" onclick="S.month=${i};render()">${ML(i)}${S.mlock[i]?' (locked)':''}</button>`).join('');
 const grid=S.res.map(r=>{const used=P.reduce((a,p)=>a+(((pl[m]||{})[p.id]||{})[r.id]||0),0);
  return `<tr><td>${E(r.name)}</td>${P.map(p=>`<td><input type="number" step="0.25" min="0" ${p.lock||S.mlock[m]?'disabled':''} value="${D2(((pl[m]||{})[p.id]||{})[r.id]||0)}" onchange="edit(${m},${p.id},${r.id},this.value/KK())"></td>`).join('')}<td class="n ${used>r.cap+.001?'b':'m'}">${D2(used)} / ${D2(r.cap)}</td></tr>`}).join('');
 const RES=resCard();return (S.stale?`<div class="note w2">Inputs changed since this plan was made. Optimise again to apply them.</div>`:'')+`
 <div class="k"><div><span>Planned cost, ${M} month${M>1?'s':''}</span><b class="big">${fmt(tc)}</b></div><div><span>Budget remaining</span><b class="big">${fmt(S.budget-tc)}</b></div><div><span>Budget used</span><b class="big">${S.budget?(tc/S.budget*100).toFixed(0):0}%</b></div><div><span>Unfilled ${UL()} per month</span><b class="big ${un>.01?'w':''}">${D2(un/M)}</b></div></div>
 <div class="card"><h2>Project results</h2><div class="note">${S.note||''}${S.cands[S.ci]?' Approach: '+S.cands[S.ci].label+'.':''}</div>
 <div class="sc"><table><tr><th>Project</th><th class="n">Budget</th><th class="n">Planned cost</th><th>Used</th><th class="n">%</th><th class="n">${UL()} per month</th><th>Status</th><th class="n">Remaining</th><th></th></tr>${rows}</table></div>
 <p class="m" style="margin:10px 0 0">Cost by month: ${mc}</p></div>
 ${RES}${ctl}<div class="card"><h2>Allocation by month (${UL()})</h2><div class="seg" style="margin-bottom:10px">${tabs}</div>
 <div class="g" style="margin-bottom:10px"><button onclick="S.mlock[${m}]=!S.mlock[${m}];render()">${S.mlock[m]?'Unlock':'Lock'} ${ML(m)}</button><button onclick="reoptM(${m})" ${S.mlock[m]?'disabled':''}>Optimise ${ML(m)} only</button></div>
 <div class="sc"><table><tr><th>Resource</th>${P.map(p=>`<th>${E(p.name)}${p.lock?' (locked)':''}</th>`).join('')}<th class="n">Used / available</th></tr>${grid}</table></div>
 <p class="m" style="margin:10px 0 0">Cells can be edited by hand for unlocked projects and months.</p></div>`}

function render(){const v=DB.view||'port';$('#app').innerHTML=head()+`<div class="shell ${sidebarCollapsed?'collapsed':''}">`+sideNav()+'<main>'+`<div class="workspace-intro"><div><h2>${v==='port'?'Portfolio overview':v==='setup'?'Programme setup':v==='res'?'Resource management':'Allocation workspace'}</h2><p>Plan budgets, balance capacity and compare practical allocation options.</p></div><span class="m">Local workspace · Private to this browser</span></div>`+nav()+(v==='port'?portfolio():v==='setup'?setup():v==='res'?resView():plan())+'</main></div>';save()}

paletteInit();render();initLocalStorage();
</script></body></html>
